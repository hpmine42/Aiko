<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Aiko – regelbasierter Offline-Chat</title>
  <desc id="desc">Banner: Eine Nachricht wird gegen Regeln und lokale Werkzeuge geprüft und ergibt eine Antwort – alles auf dem Gerät, ohne Netzwerk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c67c5"/>
      <stop offset="1" stop-color="#63a4ff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="880" cy="40" r="180" fill="#2c67c5" opacity=".16"/>
  <circle cx="140" cy="300" r="150" fill="#63a4ff" opacity=".08"/>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="56" y="92" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="0.5">Aiko</text>
    <text x="58" y="126" fill="#9fb6d6" font-size="18">Regelbasiert · Offline · Nur auf deinem Gerät</text>

    <!-- Flussdiagramm -->
    <g transform="translate(56, 168)">
      <rect x="0" y="0" width="196" height="56" rx="14" fill="#16181f" stroke="#2a2f3a"/>
      <text x="98" y="33" fill="#e7ecf5" font-size="15" text-anchor="middle">Deine Nachricht</text>

      <path d="M206 28 H248" stroke="#3a4356" stroke-width="2" stroke-linecap="round"/>
      <path d="M242 22 L250 28 L242 34" fill="none" stroke="#3a4356" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="258" y="0" width="300" height="56" rx="14" fill="#16181f" stroke="#2c67c5"/>
      <text x="408" y="27" fill="#e7ecf5" font-size="15" text-anchor="middle">Regeln &amp; lokale Werkzeuge</text>
      <text x="408" y="45" fill="#7d8ba1" font-size="12" text-anchor="middle">Muster · Rechner · Datum · Text</text>

      <path d="M568 28 H610" stroke="#3a4356" stroke-width="2" stroke-linecap="round"/>
      <path d="M604 22 L612 28 L604 34" fill="none" stroke="#3a4356" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="620" y="0" width="180" height="56" rx="14" fill="#16181f" stroke="#2a2f3a"/>
      <text x="710" y="33" fill="#e7ecf5" font-size="15" text-anchor="middle">Antwort</text>
    </g>

    <!-- Fakten-Chips -->
    <g transform="translate(56, 254)" font-size="13">
      <rect x="0" y="0" width="168" height="32" rx="16" fill="#12202f" stroke="#24405e"/>
      <circle cx="20" cy="16" r="5" fill="url(#accent)"/>
      <text x="36" y="21" fill="#bcd3f0">100 % offline</text>

      <rect x="182" y="0" width="196" height="32" rx="16" fill="#12202f" stroke="#24405e"/>
      <circle cx="202" cy="16" r="5" fill="url(#accent)"/>
      <text x="218" y="21" fill="#bcd3f0">kein Sprachmodell</text>

      <rect x="392" y="0" width="236" height="32" rx="16" fill="#12202f" stroke="#24405e"/>
      <circle cx="412" cy="16" r="5" fill="url(#accent)"/>
      <text x="428" y="21" fill="#bcd3f0">keine Netzwerkanfragen</text>

      <rect x="642" y="0" width="246" height="32" rx="16" fill="#12202f" stroke="#24405e"/>
      <circle cx="662" cy="16" r="5" fill="url(#accent)"/>
      <text x="678" y="21" fill="#bcd3f0">Daten bleiben lokal</text>
    </g>
  </g>
</svg>
