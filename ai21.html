/* ---------------- Regel-Testsuite ---------------- */
function testQueryFor(pat){
  const raw = String(pat).trim();
  if(!raw) return null;
  if(raw.charAt(0) === "~") return null;                                   // RegEx: kein Beispieltext
  if(raw.charAt(0) === "=") return raw.slice(1);
  if(/\{x\}/i.test(raw)) return raw.replace(/\{x\}/gi, "Test");            // Beispiel-Ersatz
  if(raw.indexOf("&") > -1) return raw.split("&").map(x => x.trim()).join(" ");
  return raw;
}
function runRuleTests(){
  const rows = [];
  cfg.pairs.forEach(p => {
    const resp = variantsOf(p.response);
    if(p.enabled === false){ rows.push({ p, q:"–", ok:"off", msg:"Regel ist deaktiviert" }); return; }
    if(!p.patterns.length){ rows.push({ p, q:"–", ok:"warn", msg:"Keine Stichwörter – Regel greift nie" }); return; }
    if(!resp.length){ rows.push({ p, q:"–", ok:"warn", msg:"Keine Antwort hinterlegt" }); return; }
    p.patterns.forEach(pat => {
      const q = testQueryFor(pat);
      if(q === null){ rows.push({ p, q:pat, ok:"skip", msg:"RegEx wird nicht mitgetestet" }); return; }
      const hit = findRule(q);
      if(!hit) rows.push({ p, q, ok:"bad", msg:"Greift nicht mehr (Score zu niedrig?)" });
      else if(hit.rule === p) rows.push({ p, q, ok:"good", msg:"✓ greift" + (resp.length > 1 ? " · " + resp.length + " Varianten" : "") });
      else rows.push({ p, q, ok:"warn", msg:"„" + ruleTitle(hit.rule) + "“ gewinnt (Priorität " + (hit.prio || 0) + ")" });
    });
  });
  return rows;
}

/* ---------------- Chat-Export ---------------- */
function exportChat(c){
  const lines = ["# " + (c.title || "Neuer Chat"), "", "_Exportiert am " + new Date().toLocaleString("de-DE") + " · " + (cfg.assistantName || "Aiko") + "_", "", "---", ""];
  c.messages.forEach(m => {
    if(m.role === "user") lines.push("**Du:** " + cur(m).replace(/\n/g, "\n\n"), "");
    else lines.push("**" + (cfg.assistantName || "Aiko") + ":** " + plain(withName(cur(m))), "");
  });
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type:"text/markdown" }));
    a.download = (c.title || "chat").replace(/[\\/:*?"<>|]/g, "-").slice(0, 40) + ".md";
    document.body.appendChild(a); a.click(); a.remove();
    toast("Chat exportiert");
  } catch(e) { copyText(lines.join("\n")); toast("Export kopiert"); }
}

    applyMask(bestMask); drawFormat(bestMask);
    return { size, modules, version:ver, ecl:eclKey || "M" };
  }
  function toSvg(q, px){
    const quiet = 4, total = q.size + quiet * 2;
    let rects = "";
    for(let y = 0; y < q.size; y++){
      let x = 0;
      while(x < q.size){
        if(q.modules[y][x]){
          let run = 1;
          while(x + run < q.size && q.modules[y][x + run]) run++;
          rects += "M" + (x + quiet) + " " + (y + quiet) + "h" + run + "v1h-" + run + "z";
          x += run;
        } else x++;
      }
    }
    return '<svg viewBox="0 0 ' + total + " " + total + '" width="' + (px || "100%") + '" shape-rendering="crispEdges" role="img" aria-label="QR-Code">' +
      '<rect width="' + total + '" height="' + total + '" fill="#fff"/><path d="' + rects + '" fill="#000"/></svg>';
  }
  return { encode, toSvg };
})();

/* ---------------- Werkzeug ---------------- */
function qrTool(t){
  const s = t.trim();
  if(!/\bqr\b|\bqrcode\b/i.test(s)) return null;
  let m, payload = null, caption = "QR-Code";
  if((m = s.match(/^(?:(?:erstelle|erzeuge|mach|generiere|zeichne)(?:\s+mir)?(?:\s+bitte)?\s+)?(?:einen?\s+)?(?:qr[-\s]?code|qr)\s*(?:für|zu)?\s*wlan\s*[:,]\s*(?:name|ssid)\s*=\s*([^;,]+?)\s*[;,]\s*(?:passwort|password|pass|key)\s*=\s*([^;]+?)\s*[;,]?\s*(?:(?:verschlüsselung|sicherheit|typ)\s*=\s*(wpa2?|wep|nopass))?\s*$/i))){
    const ssid = m[1].trim(), pass = m[2].trim();
    let sec = (m[3] || "WPA").toUpperCase();
    if(sec === "WPA2") sec = "WPA";
    payload = "WIFI:S:" + ssid.replace(/([\\;,:"])/g, "\\$1") + ";T:" + sec + ";P:" + pass.replace(/([\\;,:"])/g, "\\$1") + ";;";
    caption = "WLAN „" + ssid + "“";
  } else if(/\bwifi\s*:/.test(s) && (m = s.match(/(WIFI:[\s\S]+)$/i))){
    payload = m[1].trim(); caption = "WLAN-Zugang";
  } else if((m = s.match(/^(?:(?:erstelle|erzeuge|mach|generiere|zeichne)(?:\s+mir)?(?:\s+bitte)?\s+)?(?:einen?\s+)?(?:qr[-\s]?code|qr)\s*(?:erstellen|generieren|zeichnen|machen)?\s*(?:für|von|mit|:)?\s*([\s\S]{1,800})\s*$/i))){
    payload = m[1].trim().replace(/^["„“']+|["“”']+$/g, "");
  }
  if(!payload) return { text: "Ich erstelle dir **echte, scannbare QR-Codes** – komplett offline.\n\n- `QR-Code für https://example.com`\n- `QR-Code für Treffpunkt Marktplatz, 15 Uhr`\n- `QR WLAN: Name=MeinWLAN; Passwort=geheim123` (beim Scannen wird das WLAN verbunden)\n\nDas Bild kannst du speichern und teilen.", source:"qr" };
  if(payload.length > 800) return { text: "Der Inhalt ist mit " + fmtN(payload.length) + " Zeichen zu lang für einen QR-Code (maximal 800). Kürze ihn bitte etwas.", source:"qr" };
  let q;
  try { q = Qr.encode(payload, "M"); } catch(e) { return { text: "Das konnte ich nicht in einen QR-Code verwandeln: " + e.message, source:"qr" }; }
  return { text: "Hier ist dein QR-Code für **" + caption + "** – einfach mit der Kamera scannen. 🔳",
    source:"qr", widget:{ type:"qr", text:payload, ecl:"M", caption } };
}

let busy = false, stopNow = null;

function send(text){
  if(busy) return;
  const cp = $("#cmdpop"); if(cp) cp.classList.remove("on");
  const t = String(text != null ? text : input.value).trim();
  if(!t) return;
  input.value = ""; grow();
  if(!current.messages.length){
    let ti = t.replace(/\s+/g, " ").replace(/[?!.]+$/, "");
    ti = ti.charAt(0).toUpperCase() + ti.slice(1);
    current.title = ti.length > 38 ? ti.slice(0, 38).trim() + "…" : ti;
  }
  current.ts = Date.now();
  if(chats.indexOf(current) < 0){ if(!current.temp){ chats.unshift(current); $("#bMenu").classList.add("dot"); } }
  const um = { role:"user", content:t, ts:Date.now() };
  current.messages.push(um);
  if(thread.classList.contains("emptymode")){ thread.innerHTML = ""; thread.classList.remove("emptymode"); renderSuggest(false); }
  thread.appendChild(userEl(um, current.messages.length - 1));
  updateTop();
  scrollBottom(true);
  saveChats(); renderList();
  respond(t, null);
}
function lastAiText(chat){
  for(let i = chat.messages.length - 1; i >= 0; i--) if(chat.messages[i].role === "assistant") return cur(chat.messages[i]);
  return null;
}
function respond(prompt, target){
  const chat = current;
  busy = true; updateSend();
  const avoid = target ? cur(target) : lastAiText(chat);
  let m = target;
  if(!m){ m = { role:"assistant", variants:[""], vi:0, ts:Date.now() }; chat.messages.push(m); }
  else { m.variants.push(""); m.vi = m.variants.length - 1; m.fb = null; }
  const idx = chat.messages.indexOf(m);
  const node = el("div", "msg ai");
  node.dataset.i = idx;
  const old = thread.querySelector('.msg[data-i="' + idx + '"]');
  if(old) old.replaceWith(node); else thread.appendChild(node);

  const model = chat.model || cfg.defaultModel;
  const think = /think/i.test(model), mini = /mini/i.test(model);
  node.innerHTML = think && ui.think ? '<div class="thinking">Denkt nach</div>' : '<div class="pulse"></div>';
  document.body.classList.add("busy");
  scrollBottom(true);

  const hist = chat.messages.slice(0, idx);
  const res = pickResponse(prompt, avoid, { history: hist });
  m.meta = m.meta || [];
  m.meta[m.vi] = { rule: res.rule ? res.rule.id : null, cap: res.cap || "", source: res.source || "", val: typeof res.val === "number" && isFinite(res.val) ? res.val : null, widget: res.widget || null };
  const raw = res.text, full = withName(raw);
  const wait = !ui.think ? 150 : think ? 1800 + Math.random() * 2400 : (mini ? 250 : 450) + Math.random() * 600 + Math.min(700, prompt.length * 6);
  const t0 = Date.now();
  let done = false, buf = "", timer = null, stopped = false;
  timer = setTimeout(start, wait);
  stopNow = () => { stopped = true; clearTimeout(timer); finish(); };

  function start(){
    node.innerHTML = "";
    m.thoughts = m.thoughts || [];
    if(think && ui.think){
      m.thoughts[m.vi] = Math.max(1, Math.round((Date.now() - t0) / 1000));
      node.appendChild(el("div", "thought", "Nachgedacht für " + m.thoughts[m.vi] + " s"));
    } else m.thoughts[m.vi] = 0;
    const box = el("div", "md");
    node.appendChild(box);
    if(!ui.stream){ buf = full; box.innerHTML = md(buf); return finish(); }
    const toks = full.match(/\s+|\S+/g) || [];
    let i = 0;
    const tick = () => {
      if(stopped) return;
      let k = 1 + Math.floor(Math.random() * (full.length > 1200 ? 5 : 3));
      while(k-- > 0 && i < toks.length){ buf += toks[i++]; if(i < toks.length && /^\s+$/.test(toks[i])) buf += toks[i++]; }
      m.variants[m.vi] = buf;
      box.innerHTML = md(buf);
      if(i < toks.length) placeCaret(box);
      scrollBottom(false);
      if(i >= toks.length){ timer = setTimeout(finish, 120); return; }
      const last = buf.replace(/\s+$/, "").slice(-1);
      let d = (mini ? 12 : 24) + Math.random() * (mini ? 16 : 30);
      if(/[.!?:]/.test(last)) d += 50 + Math.random() * 120; else if(last === ",") d += 25;
      timer = setTimeout(tick, d);
    };
    tick();
  }
  function finish(){
    if(done) return; done = true;
    busy = false; stopNow = null;
    document.body.classList.remove("busy");
    // vollständig gestreamt → Rohtext mit {name} speichern (Namensänderung wirkt dann überall)
    m.variants[m.vi] = buf === full ? raw : buf;
    if(!buf){           // vor dem ersten Wort gestoppt
      if(m.variants.length > 1){ m.variants.pop(); if(m.meta) m.meta.length = m.variants.length; m.vi = m.variants.length - 1; }
      else chat.messages.splice(chat.messages.indexOf(m), 1);
      saveChats(); updateSend();
      if(chat === current) renderThread();
      return;
    }
    if(chat === current && node.parentNode) node.replaceWith(aiEl(m, chat.messages.indexOf(m)));
    chat.ts = Date.now();
    saveChats(); updateSend(); scrollBottom(false); renderList();
  }
}
function placeCaret(root){
  const c = el("span", "cur");
  let t = root.lastElementChild;
  while(t && /^(UL|OL|BLOCKQUOTE)$/.test(t.tagName) && t.lastElementChild) t = t.lastElementChild;
  if(t && /^(P|LI|H1|H2|H3)$/.test(t.tagName)) t.appendChild(c);
  else { c.classList.add("blk"); root.appendChild(c); }
}
function regenerate(i){
  if(busy) return;
  let u = i - 1;
  while(u >= 0 && current.messages[u].role !== "user") u--;
  if(u < 0) return;
  const m = current.messages[i];
  if(current.messages.length > i + 1){ current.messages = current.messages.slice(0, i + 1); renderThread(); }
  respond(current.messages[u].content, m);
}

  const mod = e.ctrlKey || e.metaKey;

  else if(mod && e.shiftKey && (e.key === "c" || e.key === "C")){ e.preventDefault(); const a = $$(".msg.ai"); const l = a[a.length - 1]; if(l){ const mm = current.messages[+l.dataset.i]; if(mm){ copyText(plain(withName(cur(mm)))); toast("Letzte Antwort kopiert"); } } }

document.addEventListener("click", e => {
  const b = e.target && e.target.closest && e.target.closest(".qr-save");
  if(!b) return;
  try {
    const q = Qr.encode(b.dataset.t || "", b.dataset.e || "M");
    const quiet = 4, total = q.size + quiet * 2, scale = 8;
    const cv = document.createElement("canvas");
    cv.width = cv.height = total * scale;
    const x = cv.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, cv.width, cv.height);
    x.fillStyle = "#000";
    for(let yy = 0; yy < q.size; yy++) for(let xx = 0; xx < q.size; xx++)
      if(q.modules[yy][xx]) x.fillRect((xx + quiet) * scale, (yy + quiet) * scale, scale, scale);
    const a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "qr-code.png";
    document.body.appendChild(a); a.click(); a.remove();
    toast("QR-Code gespeichert");
  } catch(err) { toast("Speichern hier nicht möglich"); }
});

        const a = document.createElement("a");
        a.href = cv.toDataURL("image/png");
        a.download = "diagramm.png";
        document.body.appendChild(a); a.click(); a.remove();

/* Timer-Dock: Fortschritt oben rechts – ohne Blitzen, klappt nach kurzer Zeit
   auf ein SVG-Uhr-Symbol ein (antippen vergrößert wieder, danach fährt es erneut ein). */
function fmtClock(ms){
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(sec).padStart(2, "0");
}
const DOCK = { collapsed:false, sig:"", hideTimer:null };
function dockSig(){ return DOCK.collapsed + "|" + activeTimers.map(t => t.id + (t.paused ? "p" : "r")).join("|"); }
function armDockCollapse(){
  clearTimeout(DOCK.hideTimer);
  if(!activeTimers.length) return;
  DOCK.hideTimer = setTimeout(() => { if(activeTimers.length && !DOCK.collapsed){ DOCK.collapsed = true; renderTimerDock(); } }, 5000);
}
function expandTimerDock(){ DOCK.collapsed = false; renderTimerDock(); armDockCollapse(); }
function tickTimerDock(){
  const dock = $("#timerDock");
  if(!dock || dock.hidden || DOCK.collapsed) return;
  const chips = dock.querySelectorAll(".tdock");
  activeTimers.forEach((t, i) => {
    const chip = chips[i]; if(!chip) return;
    const left = t.paused ? Math.max(0, +t.left || 0) : Math.max(0, t.end - Date.now());
    const txt = chip.querySelector(".tdock-t"); if(txt) txt.textContent = fmtClock(left);
    const bar = chip.querySelector(".tdock-bar i");
    if(bar && t.dur > 0) bar.style.width = Math.min(100, Math.max(0, (1 - left / (t.dur * 1000)) * 100)).toFixed(1) + "%";
  });
}
function renderTimerDock(){
  const dock = $("#timerDock"); if(!dock) return;
  if(!activeTimers.length){
    DOCK.collapsed = false; DOCK.sig = ""; clearTimeout(DOCK.hideTimer);
    dock.hidden = true; dock.innerHTML = ""; return;
  }
  const sig = dockSig();
  if(sig === DOCK.sig && dock.firstChild){ tickTimerDock(); return; }  // nur Zahlenstand ändern – kein Neuzeichnen, kein Blitzen
  DOCK.sig = sig;
  dock.hidden = false;
  if(DOCK.collapsed){
    dock.innerHTML = '<button type="button" class="tdock-clock" aria-label="Timer anzeigen">' + ic("clock") + "</button>";
    return;
  }
  dock.innerHTML = activeTimers.map(t => {
    const left = t.paused ? Math.max(0, +t.left || 0) : Math.max(0, t.end - Date.now());
    const pct = t.dur > 0 ? Math.min(100, Math.max(0, (1 - left / (t.dur * 1000)) * 100)) : 0;
    return '<div class="tdock" data-id="' + esc(t.id) + '">' +
      '<span class="tdock-t">' + fmtClock(left) + "</span>" +
      '<span class="tdock-bar"><i style="width:' + pct.toFixed(1) + '%"></i></span>' +
      '<button type="button" class="tdock-b" data-a="' + (t.paused ? "resume" : "pause") + '" aria-label="' + (t.paused ? "Fortsetzen" : "Anhalten") + '">' + ic(t.paused ? "play" : "pause") + "</button>" +
      '<button type="button" class="tdock-b" data-a="stop" aria-label="Timer stoppen">' + ic("close") + "</button></div>";
  }).join("");
}
$("#timerDock").addEventListener("click", e => {
  const clock = e.target && e.target.closest && e.target.closest(".tdock-clock");
  if(clock){ expandTimerDock(); return; }
  const b = e.target && e.target.closest && e.target.closest(".tdock-b");
  if(!b){ armDockCollapse(); return; }
  const chip = b.closest(".tdock"), id = chip && chip.dataset.id;
  if(!id) return;
  if(b.dataset.a === "pause") pauseTimer(id);
  else if(b.dataset.a === "resume") resumeTimer(id);
  else if(b.dataset.a === "stop"){ stopTimer(id); toast("Timer gestoppt"); }
  armDockCollapse();
});

function groupLabel(ts){
  const n = new Date(), sod = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(), day = 864e5;
  if(ts >= sod) return "Heute";
  if(ts >= sod - day) return "Gestern";
  if(ts >= sod - 6 * day) return "Letzte 7 Tage";
  if(ts >= sod - 29 * day) return "Letzte 30 Tage";
  return new Date(ts).toLocaleDateString("de-DE", { month:"long", year:"numeric" });
}

  if(!items.length){ list.appendChild(el("div", "noresult", q ? "Keine Chats gefunden." : "Deine Chats erscheinen hier.")); return; }
  let lastG = "";
  items.forEach(c => {

function deleteChat(c){

/* ---------------- Regeln per Code hinzufügen (Import) ---------------- */
let ruleCodeDraft = "";
const RULE_CODE_DOC = "DEINE AUFGABE\nDu erzeugst Chatbot-Regeln: feste Antworten auf bestimmte Nachrichten. Gib NUR den fertigen Code im unten beschriebenen Format zurück – reinen Text, OHNE Markdown-Codeblock (keine ```), OHNE Einleitung, OHNE Kommentare, OHNE Erklärungen außerhalb des Codes.\n\nFORMAT – so sieht der Code aus\nJede Regel beginnt mit „regel:“. Darunter stehen ihre Felder, jeweils eine Zeile „feld: wert“. Mehrere Regeln trennt eine eigene Zeile, die nur aus --- besteht. Zeilen mit # am Anfang sind Kommentare und werden ignoriert. Die Reihenfolge der Felder ist egal; „regel:“ und „antwort:“ sind Pflicht, alles andere optional.\n\nregel: stichwort1 | stichwort2\nantwort: Antworttext. ||| Eine alternative Antwort.\nvorschlag: Button 1 | Button 2\npriorität: 0\nnicht bei: wort1, wort2\nfolge kürzer: Kurzfassung.\nfolge einfacher: Einfach gesagt: …\nfolge warum: Weil …\nfolge beispiel: Zum Beispiel …\nfolge mehr: Mehr dazu …\nfolge nochmal: Eine andere Antwort …\naktiv: ja\n\nFELDER IM DETAIL\n\nregel: (PFLICHT) Womit jemand die Regel auslöst. Mehrere Auslöser mit „ | “ (Leerzeichen, senkrechter Strich, Leerzeichen) trennen. Vier Auslöser-Typen:\n• Normale Wörter oder Phrasen – greifen, wenn die Nachricht sie enthält (Tippfehler werden toleriert). Beispiel: regel: wie alt bist du | dein alter\n• =text – die Nachricht muss GENAU so lauten (Groß-/Klein egal). Beispiel: regel: =guten morgen\n• ~/muster/flags oder ~muster – regulärer Ausdruck; was in runden Klammern steht, wird als {x} in die Antwort übernommen. Beispiel: regel: ~/wie viele tage bis (.+)/i\n• a & b – beide Teile müssen vorkommen, egal in welcher Reihenfolge. Beispiel: regel: wetter & morgen\n• {x} mitten im Auslöser – übernimmt alles, was danach kommt, und setzt es in die Antwort. Beispiel: regel: ich mag {x} · antwort: Ich mag {x} auch!\n\nantwort: (PFLICHT) Der Antworttext. Mehrere Varianten mit „|||“ trennen – eine davon wird zufällig gewählt. Beispiel: antwort: Hallo! ||| Hey, {name}!\n• Absätze werden als \\n geschrieben (Backslash + n).\n• Markdown ist erlaubt: **fett**, *kursiv*, Listen mit „-“, Überschriften mit „###“.\n• Platzhalter: {name} = Name der Person, {x} = vom Auslöser übernommener Text, {datum}, {uhrzeit}, {wochentag} = aktuelle Werte.\n\nvorschlag: (optional) Bis zu 4 Buttons unter der Antwort, mit „ | “ getrennt. Beispiel: vorschlag: Mehr davon | Thema wechseln\n\npriorität: (optional) Ganze Zahl von -9 bis 9, Standard 0. Passen mehrere Regeln, gewinnt die höhere Zahl. Ab 1 hat die Regel Vorrang vor Rechner, Einheiten und Werkzeugen.\n\nnicht bei: (optional) Wörter (mit „,“ oder „ | “ getrennt): Steht eines davon in der Nachricht, greift die Regel nicht. Beispiel: nicht bei: nicht, kein\n\nfolge …: (optional) Antworten auf direkte Nachfragen zur letzten Antwort. Verwende GENAU diese Schlüssel:\n• folge kürzer – auf „kürzer“, „tl;dr“\n• folge einfacher – auf „einfacher bitte“, „versteh ich nicht“\n• folge warum – auf „warum?“, „wieso?“\n• folge beispiel – auf „ein Beispiel?“, „zeig mal“\n• folge mehr – auf „mehr dazu“, „genauer“\n• folge nochmal – auf „nochmal“, „anders“\nVarianten wieder mit „|||“ trennen.\n\naktiv: (optional) ja (Standard) oder nein. nein = Regel ist angelegt, aber ausgeschaltet.\n\nREGELN FÜR DEN CODE\n1. Eine Zeile pro Feld: „feld: wert“. Der Doppelpunkt trennt den Namen vom Wert.\n2. Leere Felder weglassen – nie „feld:“ mit leerem Wert schreiben.\n3. Keine zusätzlichen Feldnamen erfinden; nur die oben genannten benutzen.\n4. Maximal 50 Regeln auf einmal; mehrere Regeln NUR mit einer eigenen Zeile „---“ trennen.\n5. Außerhalb des Codes steht nichts – keine Überschriften, Tabellen oder Schlussworte.\n\nBEISPIEL – so sieht fertiger Code aus:\n\nregel: was ist deine lieblingsfarbe | lieblingsfarbe\nantwort: Meine Lieblingsfarbe ist Blau! ||| Heute eher Grün, {name}.\nvorschlag: Und deine? | Warum Blau?\npriorität: 1\nfolge warum: Blau beruhigt mich.\nfolge beispiel: Denk an einen wolkenlosen Himmel.\n---\nregel: =hallo\nantwort: Hallo {name}! Wie kann ich helfen?";
function splitPipes(str){
  const parts = String(str).split("|").map(x => x.trim()).filter(Boolean), out = [];
  for(let i = 0; i < parts.length; i++){
    let p = parts[i];
    if(p.indexOf("~/") === 0 && !/\/[a-z]*$/i.test(p)){
      while(i + 1 < parts.length && !/\/[a-z]*$/i.test(p)) p += "|" + parts[++i];
    }
    out.push(p);
  }
  return out;
}
function parseRuleCode(text){
  const rules = [], errors = [];
  let cur = null, curLine = 0;
  const finish = () => {
    if(!cur) return;
    if(!cur.patterns.length) errors.push("Regel " + (rules.length + 1) + " (ab Zeile " + curLine + "): „regel:“ mit mindestens einem Stichwort fehlt");
    else if(!cur.response) errors.push("Regel " + (rules.length + 1) + " (ab Zeile " + curLine + "): „antwort:“ fehlt");
    rules.push(cur); cur = null;
  };
  String(text || "").split(/\r?\n/).forEach((ln, i) => {
    const lineNo = i + 1, t = ln.trim();
    if(!t || t.charAt(0) === "#") return;
    if(/^---+$/.test(t)){ finish(); return; }
    const m = t.match(/^([^:]{1,40}?):\s*(.*)$/);
    if(!m){ errors.push("Zeile " + lineNo + ": Erwartet „feld: wert“ – oder eine Trennzeile „---“"); return; }
    const key = m[1].toLowerCase().trim().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/\s+/g, " ");
    const val = m[2].trim().replace(/\\n/g, "\n");
    if(!cur){ cur = { enabled:true, patterns:[], response:"" }; curLine = lineNo; }
    if(key === "regel" || key === "muster" || key === "stichwort" || key === "stichwoerter" || key === "pattern" || key === "patterns"){
      const parts = splitPipes(val);
      if(!parts.length) errors.push("Zeile " + lineNo + ": „regel:“ braucht mindestens ein Stichwort");
      cur.patterns = cur.patterns.concat(parts);
    } else if(key === "antwort" || key === "antworten" || key === "response" || key === "antworttext"){
      if(!val) errors.push("Zeile " + lineNo + ": „antwort:“ ist leer");
      else cur.response = cur.response ? cur.response + "|||" + val : val;
    } else if(key === "vorschlag" || key === "vorschlaege" || key === "suggest"){
      cur.suggest = (cur.suggest || []).concat(splitPipes(val)).slice(0, 4);
    } else if(key === "prio" || key === "prioritaet" || key === "priority"){
      const n = parseInt(val, 10);
      if(!(n >= -9 && n <= 9)) errors.push("Zeile " + lineNo + ": priorität muss eine Zahl von -9 bis 9 sein");
      else cur.priority = n;
    } else if(key === "nicht bei" || key === "ausschliessen" || key === "exclude" || key === "nicht"){
      cur.exclude = (cur.exclude || []).concat(val.split(/[,;|]/).map(x => x.trim()).filter(Boolean));
    } else if(key === "aktiv" || key === "enabled" || key === "an"){
      if(/^(ja|yes|true|an|1)$/i.test(val)) cur.enabled = true;
      else if(/^(nein|no|false|aus|0)$/i.test(val)) cur.enabled = false;
      else errors.push("Zeile " + lineNo + ": aktiv muss ja oder nein sein");
    } else if(/^folge /.test(key)){
      const kind = key.slice(6).trim();
      if(["kuerzer", "einfacher", "warum", "beispiel", "mehr", "nochmal"].indexOf(kind) < 0)
        errors.push("Zeile " + lineNo + ": Folge-Frage „" + kind + "“ gibt es nicht (erlaubt: kürzer, einfacher, warum, beispiel, mehr, nochmal)");
      else { cur.followups = cur.followups || {}; cur.followups[kind] = val; }
    } else {
      errors.push("Zeile " + lineNo + ": Unbekanntes Feld „" + m[1].trim() + "“");
    }
  });
  finish();
  if(rules.length > 50){ errors.push("Maximal 50 Regeln pro Einfügung"); return { rules: rules.slice(0, 50), errors }; }
  return { rules, errors };
}
function renderRuleCodeMsg(){
  const msg = $("#ruleCodeMsg"), btn = $("#ruleCodeAdd"), box = $("#ruleCodeIn");
  if(!msg || !btn || !box) return;
  if(!box.value.trim()){
    msg.textContent = "Füge Code ein – bei gültigem Code wird der Button unten aktiv.";
    msg.className = "help"; btn.disabled = true; return;
  }
  const res = parseRuleCode(box.value);
  if(res.errors.length){
    msg.textContent = res.errors.slice(0, 3).join(" · ") + (res.errors.length > 3 ? " …" : "");
    msg.className = "help err"; btn.disabled = true; return;
  }
  msg.textContent = "✓ " + res.rules.length + (res.rules.length === 1 ? " Regel bereit." : " Regeln bereit.");
  msg.className = "help ok";
  btn.disabled = false;
}
function addRuleCode(){
  const box = $("#ruleCodeIn"); if(!box) return;
  const res = parseRuleCode(box.value);
  if(res.errors.length || !res.rules.length){ renderRuleCodeMsg(); return; }
  res.rules.forEach((r, i) => { r.id = "p" + Date.now() + i; cfg.pairs.push(r); });
  saveCfg();
  ruleCodeDraft = "";
  renderSettings();
  toast(res.rules.length === 1 ? "Regel hinzugefügt" : res.rules.length + " Regeln hinzugefügt");
}

    const fails = rows.filter(r => r.ok === "bad" || r.ok === "warn");

    const row = r => '<div class="item"><div class="rt"><div class="k">' + icon[r.ok] + " " + esc(ruleTitle(r.p)) + '</div><div class="p">' + esc(r.q + " → " + r.msg) + "</div></div></div>";
    const moreOpen = n => "Alle " + n + " weiteren Prüfungen anzeigen";
    box.innerHTML = '<div class="card">' +
      '<div class="item"><div class="rt"><div class="k">' + rows.filter(r => r.ok === "good").length + " von " + rows.length + " Prüfungen in Ordnung" + (fails.length ? ' · <b style="color:var(--danger)">' + fails.length + (fails.length === 1 ? " Problem" : " Probleme") + "</b>" : "") +
      '</div><div class="p">' + (fails.length ? "Hier stehen nur die fehlgeschlagenen Prüfungen – mit Grund." : "Alles bestanden.") + " Mit „Alle Regeln testen“ klappt du den Bericht wieder zu.</div></div></div>" +
      fails.map(row).join("") +
      (rest.length ? '<div class="card"><button class="item" id="testMore" style="color:var(--accent2)">' + moreOpen(rest.length) + "</button></div>" : "") +
      '<div class="card"' + (rest.length ? " hidden" : "") + ' id="testRest">' + rest.map(row).join("") + "</div>";
    const more = $("#testMore");
    if(more) more.onclick = () => {
      const r = $("#testRest"), open = !r.hidden;
      r.hidden = open;
      more.textContent = open ? moreOpen(rest.length) : "Weitere Prüfungen ausblenden";
    };
  };
  $$("#sTheme button").forEach(x => x.onclick = () => { ui.theme = x.dataset.t; saveUi(); save(LS.theme, ui.theme); applyTheme(); renderSettings(); });
  $("#sStream").onchange = e => { ui.stream = e.target.checked; saveUi(); };
  $("#sThink").onchange = e => { ui.think = e.target.checked; saveUi(); };
  $("#sCalm").onchange = e => { ui.calm = e.target.checked; saveUi(); document.body.classList.toggle("calm", ui.calm); };
  $("#sSug").onchange = e => { ui.suggest = e.target.checked; saveUi(); renderThread(); };
  $("#sAvBtn").onclick = () => $("#avFile").click();
  $("#sHist").onchange = e => { ui.saveHistory = e.target.checked; saveUi(); saveChats(); };
  $("#sFf").oninput = e => { cfg.followFallback = e.target.value; saveCfg(); };
  $("#sMem").oninput = e => { cfg.memory = e.target.value.split("\n").map(x => x.trim()).filter(Boolean); saveCfg(); };
  $("#sKnow").oninput = e => { cfg.knowledge = e.target.value; saveCfg(); };
  $("#sDict").oninput = e => { cfg.dictionary = e.target.value; saveCfg(); };
  $("#sBackup").onclick = downloadBackup;
  $("#sRestore").onclick = () => $("#bFile").click();
  $("#sFb").oninput = e => { cfg.fallback = variantsOf(e.target.value); saveCfg(); };
  $("#sGreet").oninput = e => {
    cfg.greetings = e.target.value.split("\n").map(x => x.trim()).filter(Boolean);
    if(!cfg.greetings.length) cfg.greetings = clone(DEFAULT_CONFIG.greetings);
    saveCfg(); if(!current.messages.length) current.greet = pickGreet();
  };
  $$("[data-rule]", b).forEach(x => x.onclick = () => openRule(+x.dataset.rule));
  $("#addRule").onclick = () => {
    cfg.pairs.push({ id:"p" + Date.now(), enabled:true, patterns:[], response:"" });
    saveCfg(); openRule(cfg.pairs.length - 1, true);
  };
  const rcIn = $("#ruleCodeIn");
  if(rcIn){
    rcIn.oninput = () => { ruleCodeDraft = rcIn.value; renderRuleCodeMsg(); };
    $("#ruleCodeCopy").onclick = () => { copyText(RULE_CODE_DOC); toast("Vorlage kopiert"); };
    $("#ruleCodeAdd").onclick = addRuleCode;
    renderRuleCodeMsg();
  }
  $("#sJson").onclick = () => { $("#jsonText").value = JSON.stringify(cfg, null, 2); openPage("jsonPage"); };
  $("#sClear").onclick = async () => {
    if(!(await dialog({ title:"Alle Chats löschen?", text:"Dein gesamter Chatverlauf wird entfernt. Deine Regeln bleiben erhalten.", ok:"Löschen", danger:true }))) return;
    if(busy && stopNow) stopNow();
    chats = []; current = makeChat(); saveChats(); renderList(); toast("Alle Chats gelöscht");
  };
  $("#sReset").onclick = async () => {
    if(!(await dialog({ title:"Auf Standard zurücksetzen?", text:"Alle eigenen Regeln, Namen und Einstellungen werden durch die Standardwerte ersetzt.", ok:"Zurücksetzen", danger:true }))) return;
    cfg = normalizeCfg(null); ui = { stream:true, think:true, saveHistory:true, theme:"dark" };
    saveCfg(); saveUi(); save(LS.theme, "dark"); applyTheme(); applyNames(); renderSettings(); toast("Zurückgesetzt");
  };
}

/* ---------------- Regel-Editor ---------------- */
let editIdx = -1, editIsNew = false;
function openRule(i, isNew){
  editIdx = i;
  editIsNew = !!isNew;
  const p = cfg.pairs[i];
  $("#ruleTitle").textContent = isNew ? "Neue Regel" : "Regel bearbeiten";
  $("#ruleBody").innerHTML =
    '<div class="card" style="margin-top:6px"><label class="item">Regel aktiv' + sw("rOn", p.enabled) + "</label></div>" +
    '<div class="field"><label>Stichwörter / Fragen – eine pro Zeile</label><textarea id="rPat" rows="5" class="mono" placeholder="z. B.&#10;wie alt bist du&#10;dein alter">' + esc(p.patterns.join("\n")) + "</textarea></div>" +
    '<div class="help"><code>hallo</code> Nachricht enthält das Wort · <code>=hallo</code> Nachricht ist genau so · <code>~^hi\\b</code> regulärer Ausdruck</div>' +
    '<div class="field"><label>Antwort</label><textarea id="rResp" rows="9" placeholder="Antwort 1&#10;|||&#10;Antwort 2">' + esc(variantsOf(p.response).length > 1 ? variantsOf(p.response).join("\n\n|||\n\n") : p.response) + "</textarea></div>" +
    info("Antworten &amp; Markdown", "<ul><li>Mehrere Varianten mit <code>|||</code> trennen – davon wird zufällig eine gewählt.</li><li><code>{name}</code> wird durch deinen Namen ersetzt.</li><li>Markdown: <code>**fett**</code>, <code>*kursiv*</code>, <code>- Liste</code>, <code>### Überschrift</code>, Tabellen sowie Codeblöcke mit <code>```</code>.</li></ul>") +
    '<div class="vars" id="rVars"></div>' +
    '<div class="rowf"><div class="field"><label>Priorität (−9 … 9)</label><input type="number" id="rPrio" min="-9" max="9" value="' + (p.priority || 0) + '"></div>' +
    '<div class="field"><label>Nicht reagieren, wenn enthalten</label><input type="text" id="rEx" placeholder="z. B. nicht, kein" value="' + esc((p.exclude || []).join(", ")) + '"></div></div>' +
    info("Stichwörter, Priorität &amp; Platzhalter – einfach erklärt",
      "<ul>" +
      "<li><b>Wer gewinnt?</b> Passen mehrere Regeln auf eine Nachricht, gewinnt die mit der <b>höchsten Priorität</b> (−9 bis 9, Standard 0). Ab Priorität <b>1</b> hat die Regel sogar Vorrang vor Rechner &amp; Werkzeugen – auf „5 km in Meilen“ antwortet dann die Regel.</li>" +
      "<li><b>Tippfehler?</b> Kein Problem: <code>hallo</code> findet auch „halo“ oder „Halllo“.</li>" +
      "<li><b>Mehrere Begriffe verlangen:</b> <code>wetter & morgen</code> – beide Wörter müssen in der Nachricht vorkommen, egal in welcher Reihenfolge.</li>" +
      "<li><b>Rest der Nachricht übernehmen:</b> Im Muster <code>ich mag {x}</code> steht <code>{x}</code> für alles, was danach kommt – in der Antwort wird <code>{x}</code> an genau dieser Stelle eingesetzt. Beispiel: Antwort „Ich mag {x} auch!“ → „Ich mag Pizza“ wird zu „Ich mag Pizza auch!“</li>" +
      "<li><b>Automatische Platzhalter:</b> <code>{datum}</code> = heutiges Datum, <code>{uhrzeit}</code> = aktuelle Uhrzeit, <code>{wochentag}</code> = Montag bis Sonntag, <code>{name}</code> = dein Name.</li>" +
      "<li><b>Nicht reagieren:</b> Steht eines der Wörter aus „Nicht reagieren, wenn enthalten“ in der Nachricht, greift die Regel nicht.</li>" +
      "</ul>") +
    '<div class="field"><label>Vorschlags-Buttons unter der Antwort (einer pro Zeile, max. 4)</label><textarea id="rSug" rows="2" placeholder="z. B.&#10;Noch ein Beispiel">' + esc((p.suggest || []).join("\n")) + "</textarea></div>" +
    '<div class="btns"><button class="btn" id="rDup">Regel duplizieren</button></div>' +
    '<div class="sec" style="margin-top:14px">Folgeantworten (Kontext)</div>' +
    info("Wofür sind Folgeantworten?", "Wird genutzt, wenn direkt nach dieser Antwort nachgefragt wird – z. B. „warum?“, „Beispiel?“ oder „Nochmal!“. Leer lassen = automatische Antwort. Mehrere Varianten mit <code>|||</code> trennen.") +
    FU_KINDS.map(([k, l, ex]) => '<div class="field fu"><label>' + l + ' <span style="opacity:.7">– ' + ex + '</span></label><textarea data-fu="' + k + '" rows="2">' + esc((p.followups || {})[k] || "") + "</textarea></div>").join("") +
    '<div class="field"><label>Testen – schreib eine Beispielfrage</label><input type="text" id="rTest" placeholder="Wie würdest du fragen?"></div>' +
    '<div id="rRes"></div>' +
    '<div class="btns" style="grid-template-columns:1fr"><button class="btn pri" id="rDone">Fertig</button></div>';

  const pat = $("#rPat"), resp = $("#rResp"), test = $("#rTest");
  test.value = p.patterns[0] ? p.patterns[0].replace(/^[=~]/, "") : "";
  const upd = () => {
    p.patterns = pat.value.split("\n").map(s => s.trim()).filter(Boolean);
    p.response = resp.value;
    saveCfg();
    const v = variantsOf(p.response);
    $("#rVars").innerHTML = '<div class="vh">' + (v.length === 0 ? "Noch keine Antwort" : v.length === 1 ? "1 Antwort" : v.length + " Varianten – eine wird zufällig gewählt") + "</div>" +
      (v.length > 1 ? "<ol>" + v.map(x => "<li>" + esc(plain(withName(x))) + "</li>").join("") + "</ol>" : "");
    runTest();
  };
  const runTest = () => {
    const q = test.value.trim(), box = $("#rRes");
    if(!q){ box.innerHTML = ""; return; }
    const r = pickResponse(q, null, null);
    let badge;
    if(r.rule === p) badge = '<span class="badge ok">✓ Diese Regel greift' + (r.total > 1 ? " · Variante " + (r.index + 1) + " von " + r.total : "") + "</span>";
    else if(r.rule) badge = '<span class="badge warn">Eine andere Regel greift: „' + esc(ruleTitle(r.rule)) + "“</span>";
    else if(SOURCE_LABEL[r.source]) badge = '<span class="badge fb">Keine Regel – stattdessen: ' + SOURCE_LABEL[r.source] + '</span>';
    else badge = '<span class="badge fb">Keine Regel passt – es kommt eine Standardantwort</span>';
    box.innerHTML = '<div class="testres">' + badge + '<div class="md">' + md(withName(r.text)) + "</div>" +
      (r.rule === p && r.total > 1 ? '<button class="btn" id="rAgain" style="margin-top:12px">' + ic("regen") + "Andere Variante testen</button>" : "") + "</div>";
    const again = $("#rAgain"); if(again) again.onclick = runTest;
  };
  pat.oninput = upd; resp.oninput = upd; test.oninput = runTest;
  $("#rPrio").oninput = e => { p.priority = Math.max(-9, Math.min(9, parseInt(e.target.value, 10) || 0)); saveCfg(); runTest(); };
  $("#rEx").oninput = e => { p.exclude = e.target.value.split(",").map(x => x.trim()).filter(Boolean); saveCfg(); runTest(); };
  $("#rSug").oninput = e => { p.suggest = e.target.value.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 4); saveCfg(); };
  $("#rDup").onclick = () => {
    const c = JSON.parse(JSON.stringify(p));
    c.id = "p" + Date.now();
    cfg.pairs.splice(editIdx + 1, 0, c); saveCfg();
    toast("Regel dupliziert");
    closePage("rulePage"); renderSettings();
    openRule(cfg.pairs.findIndex(x => x.id === c.id));
  };
  $$("[data-fu]").forEach(t => t.oninput = () => { p.followups = p.followups || {}; const v = t.value; if(v.trim()) p.followups[t.dataset.fu] = v; else delete p.followups[t.dataset.fu]; saveCfg(); });
  $("#rOn").onchange = e => { p.enabled = e.target.checked; saveCfg(); runTest(); };
  $("#rDone").onclick = () => { cleanupRule(); closePage("rulePage"); renderSettings(); };
  $("#ruleDel").onclick = async () => {
    if(!(await dialog({ title:"Regel löschen?", text:"„" + ruleTitle(p) + "“ wird entfernt.", ok:"Löschen", danger:true }))) return;
    const k = cfg.pairs.indexOf(p); if(k > -1) cfg.pairs.splice(k, 1);
    saveCfg(); closePage("rulePage"); renderSettings(); toast("Regel gelöscht");
  };
  upd();
  openPage("rulePage");
}
/* leere neue Regeln nicht stehen lassen (beim Verlassen) */
function cleanupRule(){
  const p = cfg.pairs[editIdx];
  const touched = p && (p.patterns.length || p.response.trim() || p.priority || (p.exclude || []).length ||
    (p.suggest || []).length || (p.followups && Object.keys(p.followups).length));
  if(editIsNew && p && !touched) cfg.pairs.splice(editIdx, 1);
  editIdx = -1; editIsNew = false;
  saveCfg();
}

/* ---------------- Import / Export ---------------- */
$("#jCopy").onclick = () => { copyText($("#jsonText").value); toast("Kopiert"); };
$("#jApply").onclick = () => {
  try {
    let obj = JSON.parse($("#jsonText").value);
    if(Array.isArray(obj)) obj = { pairs: obj };
    if(!obj || typeof obj !== "object") throw new Error("Kein gültiges Objekt");
    cfg = normalizeCfg(obj); saveCfg(); applyNames();
    toast("Übernommen · " + cfg.pairs.length + " Regeln");
  } catch(e) { toast("Ungültiges JSON: " + e.message); }
};
$("#jDown").onclick = () => {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], { type:"application/json" }));
    a.download = "nova-antworten.json"; document.body.appendChild(a); a.click(); a.remove();
  } catch(e) { toast("Speichern hier nicht möglich – nutze „Kopieren“"); }
};
$("#jOpen").onclick = () => $("#jFile").click();
$("#jFile").onchange = e => {
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { $("#jsonText").value = String(r.result || ""); toast("Datei geladen – tippe auf „Übernehmen“"); };
  r.readAsText(f); e.target.value = "";
};

/* ---------------- Komplettes Backup ---------------- */
function downloadBackup(){
  const data = { app:"nova", version:2, created:new Date().toISOString(), config:cfg, ui, chats: chats.filter(c => !c.temp) };
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }));
    a.download = "nova-backup-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a); a.click(); a.remove();
    toast("Backup gespeichert");
  } catch(e) { copyText(JSON.stringify(data)); toast("Download nicht möglich – Backup wurde kopiert"); }
}
function restoreBackup(text){
  let o; try { o = JSON.parse(text); } catch(e) { toast("Keine gültige Backup-Datei"); return false; }
  if(!o || typeof o !== "object" || !o.config) { toast("Das ist kein Nova-Backup"); return false; }
  cfg = normalizeCfg(o.config); saveCfg();
  if(o.ui && typeof o.ui === "object"){ ui = Object.assign({ stream:true, think:true, saveHistory:true, theme:"dark" }, o.ui); saveUi(); save(LS.theme, ui.theme); }
  if(Array.isArray(o.chats)){ if(busy && stopNow) stopNow(); chats = o.chats.filter(c => c && Array.isArray(c.messages) && c.messages.length).map(normChat); current = makeChat(); saveChats(); }
  applyTheme(); document.body.classList.toggle("calm", !!ui.calm); applyNames(); renderThread(); renderList();
  if($("#setPage").classList.contains("open")) renderSettings();
  toast("Wiederhergestellt · " + chats.length + " Chats, " + cfg.pairs.length + " Regeln");
  return true;
}
/* Profilbild: wird lokal gespeichert und auf 128×128 verkleinert */
(() => {
  const av = document.createElement("input"); av.type = "file"; av.accept = "image/*"; av.id = "avFile"; av.hidden = true; document.body.appendChild(av);
  av.onchange = () => {
    const file = av.files && av.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement("canvas"), S = 128;
          c.width = c.height = S;
          const x = c.getContext("2d"), side = Math.min(img.width, img.height);
          x.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
          cfg.avatar = c.toDataURL("image/jpeg", .85); saveCfg();
          renderSettings(); if(typeof renderAvatar === "function") renderAvatar();
          toast("Profilbild geändert");
        } catch(e) { toast("Bild konnte nicht gelesen werden"); }
        img.onload = img.onerror = null;
        img.src = "";
      };
      img.onerror = () => { img.onload = img.onerror = null; toast("Bild konnte nicht gelesen werden"); };
      img.src = String(r.result || "");
    };
    r.readAsDataURL(file); av.value = "";
  };
})();
(() => {
  const f = document.createElement("input"); f.type = "file"; f.accept = "application/json,.json"; f.id = "bFile"; f.hidden = true; document.body.appendChild(f);
  f.onchange = () => {
    const file = f.files && f.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = async () => { if(await dialog({ title:"Backup wiederherstellen?", text:"Regeln, Einstellungen und Chats werden durch den Inhalt des Backups ersetzt.", ok:"Wiederherstellen", danger:true })) restoreBackup(String(r.result || "")); };
    r.readAsText(file); f.value = "";
  };
})();

/* ---------------- Start ---------------- */
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if($("#dlg").classList.contains("on")) return;
  if(pop.classList.contains("on")) return closePop();
  if(asheet.classList.contains("open")) return closeSheet();
  const pages = $$(".page.open");
  if(pages.length){ const top = pages.find(p => p.classList.contains("z2")) || pages[0]; top.querySelector("[data-close]").click(); return; }
  if(side.classList.contains("open")) closeSide();
});
window.addEventListener("pageshow", () => scrollBottom(false));
if(window.visualViewport) window.visualViewport.addEventListener("resize", () => { $("#app").style.height = window.visualViewport.height + "px"; scrollBottom(false); });

applyTheme();
document.body.classList.toggle("calm", !!ui.calm);
renderThread();
renderList();
grow();

/* Für Tests */
window.__nova = { pickResponse, findRule, md, withName, restoreBackup, parseRuleCode, get cfg(){ return cfg; }, get current(){ return current; }, get activeTimers(){ return activeTimers; } };
})();
